<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Radar Scan Gradient -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.03); }
      }
      @keyframes radarSweep {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes nodeBlink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes textShimmer {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.8)); }
      }

      .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .radar-line { animation: radarSweep 6s linear infinite; }
      .node-1 { animation: nodeBlink 2.5s ease-in-out infinite 0.2s; }
      .node-2 { animation: nodeBlink 3.2s ease-in-out infinite 1.1s; }
      .node-3 { animation: nodeBlink 2.8s ease-in-out infinite 1.9s; }
      .node-4 { animation: nodeBlink 3.6s ease-in-out infinite 0.7s; }
      .floating-shield { animation: floatShield 5s ease-in-out infinite; }
      .shimmer-text { animation: textShimmer 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Cyber Grid -->
  <rect width="1200" height="360" fill="url(#cyberGrid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="180" r="150" fill="#7c3aed" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="600" cy="180" r="180" fill="#4f46e5" opacity="0.08" filter="url(#glow)" />

  <!-- Radar Scanning Beam -->
  <g class="radar-line">
    <rect x="0" y="0" width="400" height="360" fill="url(#radarBeam)" />
  </g>

  <!-- Constellation Nodes & Neural Threat Graph Background -->
  <g stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="80" y1="80" x2="220" y2="130" />
    <line x1="220" y1="130" x2="160" y2="260" />
    <line x1="160" y1="260" x2="90" y2="220" />
    <line x1="1020" y1="90" x2="1120" y2="150" />
    <line x1="1120" y1="150" x2="1060" y2="280" />
    <line x1="1060" y1="280" x2="950" y2="200" />
    <line x1="950" y1="200" x2="1020" y2="90" />
  </g>

  <!-- Blinking Nodes -->
  <circle cx="80" cy="80" r="4" fill="#38bdf8" class="node-1" filter="url(#subtleGlow)" />
  <circle cx="220" cy="130" r="5" fill="#818cf8" class="node-2" filter="url(#subtleGlow)" />
  <circle cx="160" cy="260" r="4" fill="#c084fc" class="node-3" filter="url(#subtleGlow)" />
  <circle cx="90" cy="220" r="3.5" fill="#38bdf8" class="node-4" filter="url(#subtleGlow)" />
  <circle cx="1020" cy="90" r="4.5" fill="#818cf8" class="node-3" filter="url(#subtleGlow)" />
  <circle cx="1120" cy="150" r="5.5" fill="#38bdf8" class="node-1" filter="url(#subtleGlow)" />
  <circle cx="1060" cy="280" r="4" fill="#c084fc" class="node-2" filter="url(#subtleGlow)" />
  <circle cx="950" cy="200" r="4" fill="#38bdf8" class="node-4" filter="url(#subtleGlow)" />

  <!-- Floating Shield Icon Center-Left -->
  <g class="floating-shield" transform="translate(100, 110)">
    <circle cx="50" cy="70" r="60" fill="url(#shieldGrad)" opacity="0.2" filter="url(#glow)" />
    <!-- Outer Shield Outline -->
    <path d="M 50 15 Q 85 20 90 55 Q 90 95 50 120 Q 10 95 10 55 Q 15 20 50 15 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#subtleGlow)" />
    <!-- Inner Core & Eye Symbol (Threat Detection) -->
    <path d="M 50 30 Q 75 35 78 60 Q 78 90 50 105 Q 22 90 22 60 Q 25 35 50 30 Z" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" />
    <circle cx="50" cy="65" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="50" cy="65" r="6" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle cx="50" cy="65" r="2.5" fill="#ffffff" />
  </g>

  <!-- Main Content Title and Text -->
  <g transform="translate(240, 0)">
    <!-- Category Badge Top -->
    <g transform="translate(0, 58)">
      <rect width="270" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED SECURITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" class="shimmer-text">
      Awesome Insider Risk
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5" class="shimmer-text">
      Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Enterprise SaaS Platforms &bull; Open-Source UEBA &bull; Telemetry &amp; DLP Controls
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#c7d2fe" text-anchor="middle">🛡️ UEBA Analytics</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="145" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="212" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#bae6fd" text-anchor="middle">🔒 Data Exfiltration</text>

      <!-- Pill 3 -->
      <rect x="295" y="0" width="155" height="26" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <text x="372" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#e9d5ff" text-anchor="middle">👥 Behavior Scoring</text>

      <!-- Pill 4 -->
      <rect x="460" y="0" width="135" height="26" rx="6" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1" />
      <text x="527" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#bbf7d0" text-anchor="middle">⚡ Zero Trust</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
