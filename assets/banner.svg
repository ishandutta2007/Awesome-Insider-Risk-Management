<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Radar Beam Gradient -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" rx="16" />

  <!-- Ambient Light Orbs with SMIL Animation -->
  <circle cx="160" cy="180" r="130" fill="#0284c7" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="180" r="140" fill="#7c3aed" opacity="0.15">
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="5s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;125;140" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Radar Sweep Beam -->
  <rect x="-400" y="0" width="400" height="360" fill="url(#radarBeam)">
    <animate attributeName="x" from="-400" to="1200" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Constellation Nodes & Threat Graph Lines -->
  <g stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="220" y2="130" />
    <line x1="220" y1="130" x2="160" y2="270" />
    <line x1="160" y1="270" x2="90" y2="220" />
    <line x1="1020" y1="90" x2="1120" y2="150" />
    <line x1="1120" y1="150" x2="1060" y2="280" />
    <line x1="1060" y1="280" x2="950" y2="200" />
    <line x1="950" y1="200" x2="1020" y2="90" />
  </g>

  <!-- Dynamic Pulsing Sensor Nodes -->
  <circle cx="80" cy="80" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="220" cy="130" r="5" fill="#818cf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="270" r="4.5" fill="#c084fc">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="90" cy="220" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="90" r="4.5" fill="#818cf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" />
  </circle>
  <circle cx="1120" cy="150" r="5.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="280" r="4" fill="#c084fc">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="200" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Shield Icon Center-Left -->
  <g transform="translate(95, 105)">
    <animateTransform attributeName="transform" type="translate" values="95,105; 95,98; 95,105" dur="5s" repeatCount="indefinite" />
    <circle cx="50" cy="70" r="60" fill="url(#shieldGrad)" opacity="0.25" />
    <!-- Outer Shield Outline -->
    <path d="M 50 15 Q 85 20 90 55 Q 90 95 50 120 Q 10 95 10 55 Q 15 20 50 15 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" />
    <!-- Inner Core -->
    <path d="M 50 30 Q 75 35 78 60 Q 78 90 50 105 Q 22 90 22 60 Q 25 35 50 30 Z" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.8" />
    <!-- Radar Sensor Rings in Shield -->
    <circle cx="50" cy="65" r="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="50" cy="65" r="8" fill="#818cf8" opacity="0.8">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="65" r="3" fill="#ffffff" />
  </g>

  <!-- Main Content Title & Description -->
  <g transform="translate(235, 0)">
    <!-- Category Badge Top -->
    <g transform="translate(0, 56)">
      <rect width="270" height="28" rx="14" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" class="badge-text" font-size="11.5" fill="#38bdf8" letter-spacing="1.5">CURATED SECURITY ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="142" class="title-text" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Awesome Insider Risk
    </text>
    <text x="0" y="196" class="title-text" font-size="44" fill="url(#accentGrad)" letter-spacing="-0.5">
      Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="242" class="sub-text" font-size="15.5" fill="#94a3b8" letter-spacing="0.2">
      Enterprise SaaS Platforms &#8226; Open-Source UEBA &#8226; Telemetry &amp; DLP Controls
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1: UEBA -->
      <g transform="translate(0, 0)">
        <rect width="135" height="28" rx="6" fill="#4f46e5" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1" />
        <path d="M 14 10 L 14 18 L 22 18" fill="none" stroke="#c7d2fe" stroke-width="1.8" />
        <path d="M 14 14 L 18 11 L 22 14" fill="none" stroke="#c7d2fe" stroke-width="1.8" />
        <text x="74" y="19" class="sub-text" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">UEBA Analytics</text>
      </g>

      <!-- Pill 2: Exfiltration -->
      <g transform="translate(145, 0)">
        <rect width="155" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
        <rect x="12" y="12" width="10" height="8" rx="1.5" fill="none" stroke="#bae6fd" stroke-width="1.5" />
        <path d="M 14 12 L 14 9 Q 17 6 20 9 L 20 12" fill="none" stroke="#bae6fd" stroke-width="1.5" />
        <text x="86" y="19" class="sub-text" font-size="12" font-weight="600" fill="#bae6fd" text-anchor="middle">Data Exfiltration</text>
      </g>

      <!-- Pill 3: Behavior Scoring -->
      <g transform="translate(310, 0)">
        <rect width="160" height="28" rx="6" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1" />
        <circle cx="17" cy="11" r="3.5" fill="none" stroke="#e9d5ff" stroke-width="1.5" />
        <path d="M 11 20 Q 17 15 23 20" fill="none" stroke="#e9d5ff" stroke-width="1.5" />
        <text x="89" y="19" class="sub-text" font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">Behavior Scoring</text>
      </g>

      <!-- Pill 4: Zero Trust -->
      <g transform="translate(480, 0)">
        <rect width="135" height="28" rx="6" fill="#16a34a" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1" />
        <path d="M 13 14 L 17 18 L 24 10" fill="none" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="76" y="19" class="sub-text" font-size="12" font-weight="600" fill="#bbf7d0" text-anchor="middle">Zero Trust</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
</svg>